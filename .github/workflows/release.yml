# ============================================================================
# Offline Package Fetcher (OPF) — Release
#
# Triggered by pushing a version tag (for example `v0.1.0`). It rebuilds the
# exact same artifact matrix as the CI workflow, generates SHA256SUMS and
# publishes (or updates) the GitHub Release for that tag with auto-generated
# release notes.
#
# Binary-size pipeline: production builds use `-trimpath -ldflags
# "-s -w -buildid="`; Linux CLI/TUI and the Linux GUI are packed with
# `upx --best --lzma` and verified with `upx -t` before they are uploaded.
# The release job re-runs `upx -t` on every packed Linux artifact before it
# publishes, so a corrupt download can never be released.
#
# Windows: the raw .exe is deliberately NOT UPX-packed. Cortex XDR and
# comparable EDR products block packed PE files but run the raw executable.
# Each .exe is published inside a .zip archive, which reduces the download size
# while keeping the extracted binary acceptable to the endpoint agent.
#
# Darwin: UPX cannot pack Mach-O, so darwin/amd64 and darwin/arm64 are
# published as .tar.gz archives instead of raw binaries.
#
# No repository secrets are required: the default GITHUB_TOKEN with
# `contents: write` is enough to create the release and upload assets.
#
# Third-party actions pinned to the current stable major versions, checked
# against the GitHub REST API on 2026-11-21:
#   actions/checkout@v7, actions/setup-go@v7, actions/upload-artifact@v7,
#   actions/download-artifact@v8, softprops/action-gh-release@v3.
# ============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

# Never cancel a release that is already publishing; a new tag gets its own run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Creating the release and uploading assets needs write access; nothing else.
permissions:
  contents: write

env:
  # CLI/TUI are pure Go; the GUI job opts back into CGO explicitly.
  CGO_ENABLED: "0"

jobs:
  # --------------------------------------------------------------------------
  # 1. opf-cli + opf-tui for every supported platform.
  #    Linux binaries are UPX-packed and verified; Windows executables are
  #    zipped raw (Cortex XDR blocks packed PE); darwin binaries are .tar.gz
  #    archives because UPX cannot pack Mach-O. Metadata stripping applies to
  #    all targets.
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install UPX
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          # upx-ucl is Ubuntu's packaged UPX. `file` is used by the
          # post-compression format check. Windows/darwin entries skip this.
          sudo apt-get install --no-install-recommends -y upx-ucl file
          upx --version | awk 'NR==1'

      - name: Install zip
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zip unzip file

      - name: Cross-compile opf-cli and opf-tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          for cmd in opf-cli opf-tui; do
            out="dist/${cmd}-${GOOS}-${GOARCH}${ext}"
            echo "==> go build ${out}"
            go build -trimpath -ldflags "-s -w -buildid=" -o "${out}" "./cmd/${cmd}"
          done
          ls -l dist

      - name: Verify embedded build metadata
        run: |
          set -euo pipefail
          # `awk 'NR==1'` instead of `head -n 1`: head closes the pipe early and
          # the writer dies with SIGPIPE, which `pipefail` would turn into a
          # spurious job failure.
          # This must run BEFORE UPX: packing hides the Go build info.
          for binary in dist/*; do
            go version -m "${binary}" | awk 'NR==1'
          done

      - name: Compress Linux binaries with UPX
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          # `--best --lzma` is the strongest UPX mode. `upx -t` verifies each
          # packed file; either command failing fails this job, so a rejected
          # or corrupted artifact is never uploaded.
          for binary in dist/*; do
            echo "==> upx --best --lzma ${binary}"
            upx --best --lzma "${binary}"
            upx -t "${binary}"
          done
          echo "----- compressed artifact formats and sizes -----"
          file dist/*
          ls -l dist

      - name: Package Windows binaries as zip
        if: matrix.goos == 'windows'
        run: |
          set -euo pipefail
          # The .exe stays raw (Cortex XDR blocks UPX-packed PE); zip only
          # reduces the download size. Extract with any zip tool before use.
          for binary in dist/*.exe; do
            name="$(basename "${binary}")"
            echo "==> zip -9 ${name}.zip"
            zip -9 -j "dist/${name}.zip" "${binary}"
            unzip -l "dist/${name}.zip" | grep -q "${name}"
            rm "${binary}"
          done
          ls -l dist

      - name: Package macOS binaries as tar.gz
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          # UPX cannot pack Mach-O, so each macOS binary is published as a
          # gzip-compressed tar archive. The archive name keeps the original
          # binary name as its stem (for example opf-cli-darwin-arm64.tar.gz).
          for binary in dist/*; do
            name="$(basename "${binary}")"
            echo "==> tar -czf ${name}.tar.gz"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            tar -tzf "dist/${name}.tar.gz" | grep -qx "${name}"
            rm "${binary}"
          done
          ls -l dist

      - name: Smoke-test compressed opf-cli (linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          # `-h` makes Go's flag package print the usage text and return
          # flag.ErrHelp, which opf-cli handles by exiting 0. The usage output
          # is what proves the UPX-packed binary still runs.
          if output="$(./dist/opf-cli-linux-amd64 -h 2>&1)"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error title=UPX smoke test::opf-cli -h exited ${status}, expected 0"
            exit 1
          fi
          if ! grep -q -- "-target" <<< "${output}"; then
            echo "::error title=UPX smoke test::opf-cli -h did not print its usage text"
            exit 1
          fi
          echo "OK: compressed opf-cli prints usage and exits 0 as expected."

      - name: Upload ${{ matrix.goos }}/${{ matrix.goarch }} binaries
        uses: actions/upload-artifact@v7
        with:
          name: opf-cli-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. Fyne v2.8 desktop GUI for linux/amd64 and windows/amd64.
  #    The Linux GUI is UPX-packed; the Windows GUI is cross-compiled with
  #    MinGW-w64 and published raw inside a .zip (Cortex XDR blocks packed PE).
  # --------------------------------------------------------------------------
  build-gui:
    name: Build GUI (linux + windows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Fyne v2.8 and cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config file upx-ucl zip unzip gcc-mingw-w64-x86-64 \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Build opf-gui for Linux (CGO enabled)
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -buildid=" -o dist/opf-gui-linux-amd64 ./cmd/opf-gui
          file dist/opf-gui-linux-amd64
          go version -m dist/opf-gui-linux-amd64 | awk 'NR==1'

      - name: Build opf-gui for Windows (MinGW cross-compile)
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -ldflags "-s -w -buildid= -H windowsgui" \
            -o dist/opf-gui-windows-amd64.exe ./cmd/opf-gui
          file dist/opf-gui-windows-amd64.exe
          go version -m dist/opf-gui-windows-amd64.exe | awk 'NR==1'
          zip -9 -j dist/opf-gui-windows-amd64.exe.zip dist/opf-gui-windows-amd64.exe
          unzip -l dist/opf-gui-windows-amd64.exe.zip | grep -q opf-gui-windows-amd64.exe
          rm dist/opf-gui-windows-amd64.exe
          ls -l dist

      - name: Compress Linux GUI with UPX
        run: |
          set -euo pipefail
          upx --best --lzma dist/opf-gui-linux-amd64
          upx -t dist/opf-gui-linux-amd64
          file dist/opf-gui-linux-amd64
          ls -l dist/opf-gui-linux-amd64

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opf-gui-linux-windows
          path: |
            dist/opf-gui-linux-amd64
            dist/opf-gui-windows-amd64.exe.zip
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2a. Fyne GUI for linux/arm64 and windows/arm64.
  # --------------------------------------------------------------------------
  build-gui-linux-arm64:
    name: Build GUI (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Fyne v2.8 ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc pkg-config file \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Build and package opf-gui for linux/arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -buildid=" -o dist/opf-gui-linux-arm64 ./cmd/opf-gui
          file dist/opf-gui-linux-arm64
          go version -m dist/opf-gui-linux-arm64 | awk 'NR==1'
          tar -czf dist/opf-gui-linux-arm64.tar.gz -C dist opf-gui-linux-arm64
          tar -tzf dist/opf-gui-linux-arm64.tar.gz | grep -qx opf-gui-linux-arm64
          rm dist/opf-gui-linux-arm64
          ls -l dist

      - name: Upload linux/arm64 GUI
        uses: actions/upload-artifact@v7
        with:
          name: opf-gui-linux-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-gui-windows-arm64:
    name: Build GUI (windows/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build opf-gui for windows/arm64 with fyne-cross
        run: |
          set -euo pipefail
          go install github.com/fyne-io/fyne-cross@v1.6.3
          # fyne-cross packages its own icon resource; remove our ARM64 .syso
          # to avoid a duplicate ICON resource in the linker.
          rm -f cmd/opf-gui/rsrc_windows_arm64.syso
          "$(go env GOPATH)/bin/fyne-cross" windows -arch=arm64 \
            -name opf-gui -app-id org.opf.gui -icon images/icon.png \
            -env GOTOOLCHAIN=auto ./cmd/opf-gui
          unzip -o fyne-cross/dist/windows-arm64/opf-gui.zip -d fyne-cross/dist/windows-arm64
          mkdir -p dist
          cp fyne-cross/dist/windows-arm64/opf-gui.exe dist/opf-gui-windows-arm64.exe
          file dist/opf-gui-windows-arm64.exe
          zip -9 -j dist/opf-gui-windows-arm64.exe.zip dist/opf-gui-windows-arm64.exe
          unzip -l dist/opf-gui-windows-arm64.exe.zip | grep -q opf-gui-windows-arm64.exe
          rm dist/opf-gui-windows-arm64.exe
          ls -l dist

      - name: Upload windows/arm64 GUI
        uses: actions/upload-artifact@v7
        with:
          name: opf-gui-windows-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2b. Fyne v2.8 desktop GUI for macOS (native Intel/Apple Silicon builds,
  #     published as .tar.gz because UPX cannot pack Mach-O).
  # --------------------------------------------------------------------------
  build-gui-darwin:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            goarch: amd64
          - os: macos-15
            goarch: arm64
    env:
      CGO_ENABLED: "1"
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build opf-gui for macOS
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -buildid=" -o "dist/opf-gui-darwin-${GOARCH}" ./cmd/opf-gui
          file "dist/opf-gui-darwin-${GOARCH}"
          go version -m "dist/opf-gui-darwin-${GOARCH}" | awk 'NR==1'

      - name: Package macOS GUI as tar.gz
        run: |
          set -euo pipefail
          name="opf-gui-darwin-${GOARCH}"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          tar -tzf "dist/${name}.tar.gz" | grep -qx "${name}"
          rm "dist/${name}"
          ls -l dist

      - name: Upload macOS GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: opf-gui-darwin-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2c. Native installers with four profiles (bundle, GUI, TUI, CLI):
  #     Linux .run, Windows .zip (raw Go menu + MSI-free payload copy) and
  #     macOS .pkg. Each asset is architecture-specific.
  # --------------------------------------------------------------------------
  build-installer-linux:
    name: Build installer (linux)
    needs: [build, build-gui, build-gui-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opf-*
          merge-multiple: true

      - name: Install makeself
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y makeself file

      - name: Build Linux .run installers
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            payload="dist/installer-payload/${arch}"
            mkdir -p "${payload}"
            cp "dist/opf-cli-linux-${arch}" "${payload}/opf-cli"
            cp "dist/opf-tui-linux-${arch}" "${payload}/opf-tui"
            if [ "${arch}" = "amd64" ]; then
              cp dist/opf-gui-linux-amd64 "${payload}/opf-gui"
            else
              tar -xzf dist/opf-gui-linux-arm64.tar.gz -C "${payload}" opf-gui-linux-arm64
              mv "${payload}/opf-gui-linux-arm64" "${payload}/opf-gui"
            fi
            cp images/icon.png "${payload}/opf.png"
            chmod 0755 "${payload}"/opf-*
            bash scripts/installers/build-linux-installer.sh "${arch}" "${payload}" "dist/opf-installer-linux-${arch}.run"
          done
          ls -l dist/opf-installer-linux-*.run

      - name: Test Linux installer (CLI profile)
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          OPF_INSTALL_PROFILE=cli OPF_INSTALL_PREFIX="${target}" ./dist/opf-installer-linux-amd64.run >/dev/null
          test -x "${target}/bin/opf-cli"

      - name: Upload Linux installers
        uses: actions/upload-artifact@v7
        with:
          name: opf-installer-linux
          path: dist/opf-installer-linux-*.run
          if-no-files-found: error
          retention-days: 7

  build-installer-windows-cli:
    name: Build CLI/TUI installer (windows)
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opf-*
          merge-multiple: true

      - name: Assemble CLI/TUI payloads
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in 'amd64','arm64') {
            $payload = "dist\installer-payload\$arch"
            New-Item -ItemType Directory -Force $payload | Out-Null
            $tmp = "dist\unzip-$arch"
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $tmp | Out-Null
            Expand-Archive "dist\opf-cli-windows-$arch.exe.zip" -DestinationPath $tmp -Force
            Copy-Item "$tmp\opf-cli-windows-$arch.exe" "$payload\opf-cli.exe" -Force
            Remove-Item $tmp -Recurse -Force
            New-Item -ItemType Directory -Force $tmp | Out-Null
            Expand-Archive "dist\opf-tui-windows-$arch.exe.zip" -DestinationPath $tmp -Force
            Copy-Item "$tmp\opf-tui-windows-$arch.exe" "$payload\opf-tui.exe" -Force
            Remove-Item $tmp -Recurse -Force
          }

      - name: Build CLI/TUI installer zips
        env:
          OPF_TEST_INSTALLER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/installers/build-windows-installer.ps1 -Arch amd64 -PayloadRoot dist\installer-payload -Version $version -OutDir dist\installers
          ./scripts/installers/build-windows-installer.ps1 -Arch arm64 -PayloadRoot dist\installer-payload -Version $version -OutDir dist\installers

      - name: Upload CLI/TUI installers
        uses: actions/upload-artifact@v7
        with:
          name: opf-installer-windows-cli
          path: dist/installers/opf-CLI-installer-windows-*.zip
          if-no-files-found: error
          retention-days: 7

  build-installer-windows-full:
    name: Build full GUI installer (windows)
    needs: [build, build-gui, build-gui-windows-arm64]
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opf-*
          merge-multiple: true

      - name: Assemble full payloads
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in 'amd64','arm64') {
            $payload = "dist\installer-payload\$arch"
            New-Item -ItemType Directory -Force $payload | Out-Null
            $tmp = "dist\unzip-$arch"
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $tmp | Out-Null
            Expand-Archive "dist\opf-cli-windows-$arch.exe.zip" -DestinationPath $tmp -Force
            Copy-Item "$tmp\opf-cli-windows-$arch.exe" "$payload\opf-cli.exe" -Force
            Remove-Item $tmp -Recurse -Force
            New-Item -ItemType Directory -Force $tmp | Out-Null
            Expand-Archive "dist\opf-tui-windows-$arch.exe.zip" -DestinationPath $tmp -Force
            Copy-Item "$tmp\opf-tui-windows-$arch.exe" "$payload\opf-tui.exe" -Force
            Remove-Item $tmp -Recurse -Force
            New-Item -ItemType Directory -Force $tmp | Out-Null
            Expand-Archive "dist\opf-gui-windows-$arch.exe.zip" -DestinationPath $tmp -Force
            Copy-Item "$tmp\opf-gui-windows-$arch.exe" "$payload\opf-gui.exe" -Force
            Remove-Item $tmp -Recurse -Force
          }

      - name: Build full GUI installer zips
        env:
          OPF_TEST_INSTALLER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/installers/build-windows-full-installer.ps1 -Arch amd64 -PayloadRoot dist\installer-payload -Version $version -OutDir dist\installers
          ./scripts/installers/build-windows-full-installer.ps1 -Arch arm64 -PayloadRoot dist\installer-payload -Version $version -OutDir dist\installers

      - name: Upload full GUI installers
        uses: actions/upload-artifact@v7
        with:
          name: opf-installer-windows-full
          path: dist/installers/opf-Full-installer-windows-*.zip
          if-no-files-found: error
          retention-days: 7

  build-installer-darwin:
    name: Build installer (${{ matrix.os }})
    needs: [build, build-gui-darwin]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            goarch: amd64
          - os: macos-15
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opf-*
          merge-multiple: true

      - name: Build macOS .pkg installer
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          payload="dist/installer-payload/${GOARCH}"
          mkdir -p "${payload}"
          for pair in "opf-cli-darwin-${GOARCH}:opf-cli" "opf-tui-darwin-${GOARCH}:opf-tui" "opf-gui-darwin-${GOARCH}:opf-gui"; do
            src="${pair%%:*}"
            dst="${pair##*:}"
            tar -xzf "dist/${src}.tar.gz" -C "${payload}" "${src}"
            mv "${payload}/${src}" "${payload}/${dst}"
          done
          chmod 0755 "${payload}"/opf-*
          version="${GITHUB_REF_NAME#v}"
          bash scripts/installers/build-macos-installer.sh "${GOARCH}" "${payload}" "dist/opf-installer-darwin-${GOARCH}.pkg" "${version}"
          pkgutil --payload-files "dist/opf-installer-darwin-${GOARCH}.pkg" | head -n 10

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: opf-installer-darwin-${{ matrix.goarch }}
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 3. Collect every artifact, checksum them and publish the GitHub Release.
  #    Runs on ubuntu-latest, so coreutils' sha256sum is always available.
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build, build-gui, build-gui-linux-arm64, build-gui-windows-arm64, build-gui-darwin, build-installer-linux, build-installer-windows-cli, build-installer-windows-full, build-installer-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (release notes)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opf-*
          merge-multiple: true

      - name: Ensure every expected asset is present
        working-directory: dist
        run: |
          set -euo pipefail
          expected="
          opf-installer-linux-amd64.run
          opf-installer-linux-arm64.run
          opf-CLI-installer-windows-amd64.zip
          opf-CLI-installer-windows-arm64.zip
          opf-Full-installer-windows-amd64.zip
          opf-Full-installer-windows-arm64.zip
          opf-installer-darwin-amd64.pkg
          opf-installer-darwin-arm64.pkg
          "
          missing=0
          for asset in ${expected}; do
            if [ ! -f "${asset}" ]; then
              echo "::error title=Missing release asset::${asset} was not produced by the build jobs."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "All expected release assets are present."

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y file

      - name: Verify installer assets
        working-directory: dist
        run: |
          set -euo pipefail
          # Functional install/uninstall tests run in the dedicated build jobs:
          # Linux .run CLI profile, Windows CLI/TUI raw installer + uninstaller,
          # Windows full Inno installer + uninstaller, and macOS pkg payload.
          for asset in             opf-installer-linux-amd64.run             opf-installer-linux-arm64.run             opf-CLI-installer-windows-amd64.zip             opf-CLI-installer-windows-arm64.zip             opf-Full-installer-windows-amd64.zip             opf-Full-installer-windows-arm64.zip             opf-installer-darwin-amd64.pkg             opf-installer-darwin-arm64.pkg; do
            test -s "${asset}"
            file "${asset}"
          done
          echo "OK: only the eight installer assets are present."

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum opf-installer-* opf-CLI-installer-* opf-Full-installer-* > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS
          echo "----------------------"
          # Self-check: every listed digest must match the file on disk.
          sha256sum -c SHA256SUMS

      - name: Publish release (attaches binaries + SHA256SUMS)
        uses: softprops/action-gh-release@v3
        with:
          # On a tag push github.ref_name is the tag (e.g. v0.1.0).
          tag_name: ${{ github.ref_name }}
          name: OPF ${{ github.ref_name }}
          # Curated, bilingual release notes maintained in the repository.
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/opf-installer-*
            dist/opf-CLI-installer-*
            dist/opf-Full-installer-*
            dist/SHA256SUMS
