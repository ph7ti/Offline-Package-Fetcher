# ============================================================================
# Offline Package Fetcher (OPF) — Release
#
# Triggered by pushing a version tag (for example `v0.1.0`). It rebuilds the
# exact same artifact matrix as the CI workflow, generates SHA256SUMS and
# publishes (or updates) the GitHub Release for that tag with auto-generated
# release notes.
#
# Binary-size pipeline: production builds use `-trimpath -ldflags
# "-s -w -buildid="`; the Linux CLI/TUI artifacts, the Windows CLI/TUI
# executables and the Linux GUI are then packed with `upx --best --lzma` and
# verified with `upx -t` before they are uploaded. The release job re-runs
# `upx -t` on every packed artifact before it publishes, so a corrupt download
# can never be released.
#
# Windows note: packed PE files are still subject to endpoint-protection
# allow-listing on hosts running Cortex XDR and comparable EDR products. The
# binaries are packed in the CI runner (where no EDR blocks the build); users
# may need to allow-list the downloaded .exe.
#
# Darwin: UPX 4.2.2 (the version in Ubuntu's `upx-ucl` package) and UPX 5.3
# both refuse Mach-O binaries, so darwin/amd64 and darwin/arm64 are published
# as .tar.gz archives instead of raw binaries.
#
# No repository secrets are required: the default GITHUB_TOKEN with
# `contents: write` is enough to create the release and upload assets.
#
# Third-party actions pinned to the current stable major versions, checked
# against the GitHub REST API on 2026-11-21:
#   actions/checkout@v7, actions/setup-go@v7, actions/upload-artifact@v7,
#   actions/download-artifact@v8, softprops/action-gh-release@v3.
# ============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

# Never cancel a release that is already publishing; a new tag gets its own run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Creating the release and uploading assets needs write access; nothing else.
permissions:
  contents: write

env:
  # CLI/TUI are pure Go; the GUI job opts back into CGO explicitly.
  CGO_ENABLED: "0"

jobs:
  # --------------------------------------------------------------------------
  # 1. opf-cli + opf-tui for every supported platform.
  #    Linux and windows artifacts are UPX-packed and verified before upload;
  #    darwin artifacts are published as .tar.gz archives because UPX cannot
  #    pack Mach-O. Metadata stripping applies to all targets.
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install UPX
        if: matrix.goos != 'darwin'
        run: |
          sudo apt-get update
          # upx-ucl is Ubuntu's packaged UPX. `file` is used by the
          # post-compression format check. darwin entries skip this.
          sudo apt-get install --no-install-recommends -y upx-ucl file
          upx --version | awk 'NR==1'

      - name: Cross-compile opf-cli and opf-tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          for cmd in opf-cli opf-tui; do
            out="dist/${cmd}-${GOOS}-${GOARCH}${ext}"
            echo "==> go build ${out}"
            go build -trimpath -ldflags "-s -w -buildid=" -o "${out}" "./cmd/${cmd}"
          done
          ls -l dist

      - name: Verify embedded build metadata
        run: |
          set -euo pipefail
          # `awk 'NR==1'` instead of `head -n 1`: head closes the pipe early and
          # the writer dies with SIGPIPE, which `pipefail` would turn into a
          # spurious job failure.
          # This must run BEFORE UPX: packing hides the Go build info.
          for binary in dist/*; do
            go version -m "${binary}" | awk 'NR==1'
          done

      - name: Compress Linux and Windows binaries with UPX
        if: matrix.goos != 'darwin'
        run: |
          set -euo pipefail
          # `--best --lzma` is the strongest UPX mode. `upx -t` verifies each
          # packed file; either command failing fails this job, so a rejected
          # or corrupted artifact is never uploaded. darwin entries are handled
          # by the tar.gz step below.
          for binary in dist/*; do
            echo "==> upx --best --lzma ${binary}"
            upx --best --lzma "${binary}"
            upx -t "${binary}"
          done
          echo "----- compressed artifact formats and sizes -----"
          file dist/*
          ls -l dist

      - name: Package macOS binaries as tar.gz
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          # UPX cannot pack Mach-O, so each macOS binary is published as a
          # gzip-compressed tar archive. The archive name keeps the original
          # binary name as its stem (for example opf-cli-darwin-arm64.tar.gz).
          for binary in dist/*; do
            name="$(basename "${binary}")"
            echo "==> tar -czf ${name}.tar.gz"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            tar -tzf "dist/${name}.tar.gz" | grep -qx "${name}"
            rm "${binary}"
          done
          ls -l dist

      - name: Smoke-test compressed opf-cli (linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          # `-h` makes Go's flag package print the usage text and return
          # flag.ErrHelp, which opf-cli handles by exiting 0. The usage output
          # is what proves the UPX-packed binary still runs.
          if output="$(./dist/opf-cli-linux-amd64 -h 2>&1)"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error title=UPX smoke test::opf-cli -h exited ${status}, expected 0"
            exit 1
          fi
          if ! grep -q -- "-target" <<< "${output}"; then
            echo "::error title=UPX smoke test::opf-cli -h did not print its usage text"
            exit 1
          fi
          echo "OK: compressed opf-cli prints usage and exits 0 as expected."

      - name: Upload ${{ matrix.goos }}/${{ matrix.goarch }} binaries
        uses: actions/upload-artifact@v7
        with:
          name: opf-cli-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. Fyne v2.8 desktop GUI for linux/amd64 (needs CGO + OpenGL/X11 headers).
  #    Package set mirrors fyne-io/fyne's own Linux CI and satisfies
  #    go-gl/glfw v3.4 (libxkbcommon / libwayland). The ELF binary is packed
  #    with UPX and verified with `upx -t` before upload.
  # --------------------------------------------------------------------------
  build-gui:
    name: Build GUI (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Fyne v2.8 Linux build dependencies
        run: |
          sudo apt-get update
          # Build dependencies: gcc + pkg-config + OpenGL/X11/XKB/Wayland
          # development headers (mirrors fyne-io/fyne's Linux CI). `file` and
          # `upx-ucl` are only used by the compression/verification step below.
          sudo apt-get install --no-install-recommends -y \
            gcc \
            pkg-config \
            file \
            upx-ucl \
            libgl1-mesa-dev \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Build opf-gui (CGO enabled)
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -buildid=" -o dist/opf-gui-linux-amd64 ./cmd/opf-gui
          file dist/opf-gui-linux-amd64
          go version -m dist/opf-gui-linux-amd64 | awk 'NR==1'

      - name: Compress opf-gui with UPX
        run: |
          set -euo pipefail
          upx --best --lzma dist/opf-gui-linux-amd64
          upx -t dist/opf-gui-linux-amd64
          # No display is available on the runner, so `upx -t` plus a format
          # check is the GUI verification (see the workflow header).
          file dist/opf-gui-linux-amd64
          ls -l dist/opf-gui-linux-amd64

      - name: Upload opf-gui-linux-amd64
        uses: actions/upload-artifact@v7
        with:
          name: opf-gui-linux-amd64
          path: dist/opf-gui-linux-amd64
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # 3. Collect every artifact, checksum them and publish the GitHub Release.
  #    Runs on ubuntu-latest, so coreutils' sha256sum is always available.
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build, build-gui]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opf-*
          merge-multiple: true

      - name: Ensure every expected asset is present
        working-directory: dist
        run: |
          set -euo pipefail
          expected="
          opf-cli-linux-amd64
          opf-cli-linux-arm64
          opf-cli-windows-amd64.exe
          opf-cli-darwin-amd64.tar.gz
          opf-cli-darwin-arm64.tar.gz
          opf-tui-linux-amd64
          opf-tui-linux-arm64
          opf-tui-windows-amd64.exe
          opf-tui-darwin-amd64.tar.gz
          opf-tui-darwin-arm64.tar.gz
          opf-gui-linux-amd64
          "
          missing=0
          for asset in ${expected}; do
            if [ ! -f "${asset}" ]; then
              echo "::error title=Missing release asset::${asset} was not produced by the build jobs."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "All expected release assets are present."

      - name: Install UPX for artifact verification
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y upx-ucl file
          upx --version | awk 'NR==1'

      - name: Verify UPX-packed release artifacts
        working-directory: dist
        run: |
          set -euo pipefail
          # Re-verify every packed artifact after the artifact round-trip.
          # Linux and Windows are UPX-packed; darwin is tar.gz instead.
          packed="
          opf-cli-linux-amd64
          opf-cli-linux-arm64
          opf-cli-windows-amd64.exe
          opf-tui-linux-amd64
          opf-tui-linux-arm64
          opf-tui-windows-amd64.exe
          opf-gui-linux-amd64
          "
          for binary in ${packed}; do
            upx -t "${binary}"
          done
          file opf-gui-linux-amd64

      - name: Verify macOS tar.gz artifacts
        working-directory: dist
        run: |
          set -euo pipefail
          # The macOS binaries cannot be packed by UPX; verify that every
          # published archive is non-empty and contains the expected binary.
          for archive in \
            opf-cli-darwin-amd64.tar.gz \
            opf-cli-darwin-arm64.tar.gz \
            opf-tui-darwin-amd64.tar.gz \
            opf-tui-darwin-arm64.tar.gz; do
            test -s "${archive}"
            expected="$(basename "${archive}" .tar.gz)"
            tar -tzf "${archive}" | grep -qx "${expected}"
          done
          echo "OK: every macOS archive contains its expected binary."

      - name: Smoke-test downloaded opf-cli (linux/amd64)
        working-directory: dist
        run: |
          set -euo pipefail
          # Artifacts downloaded from GitHub do not preserve the executable
          # bit, so restore it before running the smoke test.
          chmod +x opf-cli-linux-amd64
          # `-h` exits 0 (flag.ErrHelp is handled); printing the usage text
          # proves the compressed binary still executes after the artifact
          # round-trip, before the release is published.
          if output="$(./opf-cli-linux-amd64 -h 2>&1)"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error title=UPX smoke test::opf-cli -h exited ${status}, expected 0"
            exit 1
          fi
          if ! grep -q -- "-target" <<< "${output}"; then
            echo "::error title=UPX smoke test::opf-cli -h did not print its usage text"
            exit 1
          fi
          echo "OK: downloaded compressed opf-cli runs and prints usage."

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum opf-* > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS
          echo "----------------------"
          # Self-check: every listed digest must match the file on disk.
          sha256sum -c SHA256SUMS

      - name: Publish release (attaches binaries + SHA256SUMS)
        uses: softprops/action-gh-release@v3
        with:
          # On a tag push github.ref_name is the tag (e.g. v0.1.0).
          tag_name: ${{ github.ref_name }}
          name: OPF ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/opf-cli-*
            dist/opf-tui-*
            dist/opf-gui-*
            dist/SHA256SUMS
