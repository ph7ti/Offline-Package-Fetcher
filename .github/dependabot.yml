# ============================================================================
# Offline Package Fetcher (OPF) — dependency updates
#
# Weekly, grouped pull requests for Go modules and for the GitHub Actions used
# by .github/workflows/*.yml. Keeping actions current matters: Node 20 based
# action versions are being retired from GitHub-hosted runners.
# ============================================================================
version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
